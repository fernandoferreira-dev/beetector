paths:
  /api/sensors/uplink:
    post:
      tags: [Sensors]
      summary: Receive a TTN sensor uplink
      parameters:
        - name: x-webhook-secret
          in: header
          required: true
          schema:
            type: string
          description: Shared secret configured for the TTN webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtnUplink'
      responses:
        '200':
          description: Uplink accepted or ignored because the device is unknown
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ignored:
                        type: string
                        example: unknown device
                  - type: string
                    example: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
