version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: express_api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TTN_APP_ID=${TTN_APP_ID}
      - TTN_END_DEVICE_ID=${TTN_END_DEVICE_ID}
      - TTN_ACCESS_KEY=${TTN_ACCESS_KEY}
      - TTN_WEBHOOK_SECRET=${TTN_WEBHOOK_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vue_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
