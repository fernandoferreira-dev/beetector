services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-angular-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped